<div style="font-family:Arial,sans-serif;max-width:520px;margin:0 auto;padding:32px;color:#1f1f1f">
  <h2 style="margin:0 0 16px">Atlas şifre kurtarma kodun</h2>
  <p style="line-height:1.6;margin:0 0 24px">
    Şifreni yenilemek için aşağıdaki tek kullanımlık kodu Atlas uygulamasına gir:
  </p>
  <div style="font-size:34px;font-weight:700;letter-spacing:10px;padding:20px;text-align:center;background:#f4f1eb;border-radius:10px;margin-bottom:24px">
    {{ .Token }}
  </div>
  <p style="font-size:13px;line-height:1.6;color:#666;margin:0 0 16px">
    Bu kod kısa süre sonra geçersiz olur. Bu isteği sen yapmadıysan bu e-postayı yok say.
  </p>
  <p style="font-size:13px;line-height:1.6;color:#666;margin:0">
    Kod yerine bağlantıyı kullanmak istersen
    <a href="{{ .ConfirmationURL }}" style="color:#b85c38">şifreni buradan yenileyebilirsin</a>.
  </p>
</div>
