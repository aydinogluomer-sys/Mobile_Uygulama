name: Supabase Release Parity Verify

# Manual operator-triggered release parity gate (`workflow_dispatch` only).
#
# Kept separate from `.github/workflows/ci.yml` by design (see
# `tools/verify-edge-deployment.mjs` header): reading live Edge Function
# metadata requires `SUPABASE_ACCESS_TOKEN`, which must never run on untrusted
# pull requests, and no automatic push workflow may mutate the frozen canonical
# database (`kbcuolhjjnmhjaarxxmu`).

on:
  workflow_dispatch:
    inputs:
      strict_staleness:
        description: 'Treat source-newer-than-deployment advisories as failures (--strict)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: supabase-release-verify
  cancel-in-progress: false

jobs:
  release-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_REF: kbcuolhjjnmhjaarxxmu
    steps:
      - name: Checkout (full history for last-commit staleness comparison)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup Node (.nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Setup Deno 2
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      # Two checks, deliberately. The job-level SUPABASE_PROJECT_REF above is the project the
      # parity step queries with SUPABASE_ACCESS_TOKEN (tools/verify-edge-deployment.mjs has no
      # canonical check of its own), so the guard must keep checking that very value: the first
      # command is the check this step has always made and is never loosened. The second command
      # removes the variable so the guard resolves the pin in supabase/config.toml instead: a
      # constant compared with itself cannot notice that file drifting to another project (BLD-14).
      - name: Enforce canonical project ref guard
        run: |
          bash supabase/predeploy_guard.sh
          env -u SUPABASE_PROJECT_REF bash supabase/predeploy_guard.sh

      - name: Typecheck & test Edge Functions before checking live parity
        env:
          DENO_NO_PACKAGE_JSON: '1'
        run: |
          deno task --config supabase/functions/deno.json check
          deno task --config supabase/functions/deno.json test

      - name: Verify live Edge Function deployment parity against DEPLOYMENT.json
        env:
          SUPABASE_ACCESS_TOKEN: ${{ fromJSON(toJSON(secrets)).SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ "${{ inputs.strict_staleness }}" = "true" ]; then
            node tools/verify-edge-deployment.mjs --project-ref "$SUPABASE_PROJECT_REF" --strict
          else
            node tools/verify-edge-deployment.mjs --project-ref "$SUPABASE_PROJECT_REF"
          fi
