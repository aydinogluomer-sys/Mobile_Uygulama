name: CI

# Atlas Phase 0 CI gate (plan §23 / §24 / §32 "CI ekle") + Edge Deno 2 & Postgres 17 verification gates.
#
# NOTE on package manager: IMPLEMENTATION_V2.md §0.A specifies `yarn install
# --frozen-lockfile`. Per plan Rule 7 ("where the plan and the real repository
# disagree, the real production code is correct"), the repository ships
# `frontend/package-lock.json` and no `yarn.lock`, so this workflow uses
# `npm ci`.
#
# The split-brain that used to sit here is resolved: `frontend/package.json`
# declared `"packageManager": "yarn@1.22.22"` while every lockfile, this
# workflow and every documented command used npm. It now declares
# `npm@11.16.0`, so the manifest, the lockfile and CI name one tool.
#
# Scope: build/verify only. No secrets, no live remote step, no publish step
# is defined here — these parallel gates prove the frontend compiles/lints/tests,
# every Edge Function typechecks and passes unit tests under Deno 2, and the
# canonical SQL schema + migrations apply cleanly on ephemeral PostgreSQL 17.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
    defaults:
      run:
        working-directory: frontend
    steps:
      # `actions/checkout@v4` and `actions/setup-node@v4` declare `node20` as
      # their own JS runtime. GitHub now forces those onto Node 24 anyway and
      # prints a deprecation annotation on every run, so the gate ended each
      # build with a warning nobody could act on and everybody learned to
      # ignore. `checkout@v5` and `setup-node@v6` are the first majors of each
      # that declare `node24`, which is what actually clears it.
      #
      # This is about the ACTIONS' runtime. The version the app builds with is
      # `.nvmrc` below, and the two are unrelated.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Single Node contract across `.nvmrc`, `frontend/package.json#engines`,
      # `frontend/eas.json` and CI (BLD-07): react-native@0.86.3 and metro@0.84.5
      # require `^20.19.4 || ^22.13.0 || ^24.3.0 || >=25.0.0`, pinned to 22.13.0 LTS.
      - name: Setup Node (.nvmrc)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Align npm with packageManager (npm@11.16.0)
        run: npm install -g npm@11.16.0

      # There is no `postinstall` any more (BLD-08): nothing rewrites files inside
      # node_modules after install, so this step installs exactly what the lockfile
      # names and the gates below check that tree, the same tree a clean clone gets.
      # frontend/__tests__/repo/noInstallTimePatching.test.ts keeps it that way.
      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      # Uses tsconfig.ci.json, NOT the default tsconfig.json. See that file's
      # header for the full reasoning; the short version is that
      # `tsconfig.json` includes `.expo/types/**/*.ts`, which holds
      # expo-router's generated typed-routes declaration. That directory is
      # gitignored and is only ever produced by the Expo dev server, so it is
      # absent here and present on every developer machine — meaning plain
      # `npx tsc --noEmit` checked a different program in the two places. This
      # step used to be exactly that command, and it failed on every push of an
      # entire phase while local runs reported 0 errors.
      #
      # `npm run typecheck:ci` is runnable locally and reproduces this step
      # byte for byte, so the divergence cannot come back invisibly.
      - name: Typecheck (CI parity — see tsconfig.ci.json)
        run: npm run typecheck:ci

      # `expo lint` walks only the app directories and reports warnings as
      # advice, so it exited 0 on 73 of them and never saw scripts/,
      # jest.setup.js or __tests__/ at all. This runs the whole repository and
      # treats a warning as a failure -- an unused variable or a missing hook
      # dependency is a defect that has not been triaged yet, and a gate that
      # prints it and passes is not a gate.
      - name: Lint (whole repo, warnings are failures)
        run: npm run lint:ci

      # `--maxWorkers=2` is not a speed knob, it is the gate's reliability.
      # jest-expo spins a React Native module registry per worker (~0.3-0.6 GB).
      # At the default worker count the suite dies in ways that look like test
      # failures but are not: V8 `Zone Allocation failed - process out of
      # memory`, `jest worker ... terminated ... signal=SIGTERM`, and
      # `Command failed: git ls-files` from the repo guards that fork a child.
      # The signature is a run with failed SUITES and zero failed TESTS, and a
      # different suite falling over each time. Measured on the dev machine
      # (7.85 GB RAM): nine distinct suites across four red runs, none of them
      # reproducible in isolation. A hosted runner has more headroom, but the
      # same cliff is there and a gate that goes red at random is not a gate.
      - name: Unit tests (jest --ci)
        run: npx jest --ci --maxWorkers=2 --workerIdleMemoryLimit=512MB

      - name: Structural gate (run-tests.js)
        run: node run-tests.js

      - name: Export — Android
        run: |
          npx expo export --platform android
          inlined="$(grep -rl "127.0.0.1:54321" dist | head -1)"
          test -n "$inlined"

      - name: Export — iOS
        run: npx expo export --platform ios

      - name: Export — Web
        run: npx expo export --platform web

      - name: Expo SDK alignment
        run: npx expo install --check

      - name: Config plugins resolve
        run: npx expo prebuild --no-install --platform all

      - name: Doctor
        run: npx expo-doctor

  edge-deno-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The repo-root package.json (a tooling dependency, playwright) makes Deno 2 switch to "manual"
    # node_modules: every npm: package must already be installed there. jsr:@supabase/supabase-js
    # 2.118.0 pulls in npm:@supabase/realtime-js, which is not, so `deno check` failed before it
    # read any of our code (this job had never been green). The Edge Functions do not use that
    # package.json; with it ignored Deno resolves npm: packages from its own cache, as the
    # Supabase Edge runtime does.
    env:
      DENO_NO_PACKAGE_JSON: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Deno 2
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      # The guard resolves the ref in this order: the SUPABASE_PROJECT_REF variable, then
      # supabase/.temp, then supabase/config.toml. Passing the canonical value in through the
      # variable made this step compare a constant with itself (BLD-14): it could never notice
      # config.toml's project_id drifting to another project. `env -u` removes the variable so
      # the ref really is read from config.toml (supabase/.temp does not exist in a checkout),
      # and the two negative controls prove the guard still refuses a wrong ref and a drifted
      # config.toml. No project identifier other than the canonical one is written here.
      - name: Verify canonical project ref guard (offline; ref resolved from supabase/config.toml)
        run: env -u SUPABASE_PROJECT_REF bash supabase/predeploy_guard.sh

      - name: Guard must refuse a non-canonical ref (negative control)
        run: |
          if SUPABASE_PROJECT_REF=not-the-canonical-ref bash supabase/predeploy_guard.sh; then
            echo "predeploy_guard.sh accepted a non-canonical ref" >&2; exit 1
          fi

      - name: Guard must refuse a drifted config.toml (negative control)
        run: |
          tmp="$(mktemp -d)"; mkdir -p "$tmp/supabase"
          cp supabase/predeploy_guard.sh "$tmp/supabase/predeploy_guard.sh"
          printf 'project_id = "not-the-canonical-ref"\n' > "$tmp/supabase/config.toml"
          if env -u SUPABASE_PROJECT_REF bash "$tmp/supabase/predeploy_guard.sh"; then
            echo "predeploy_guard.sh accepted a drifted config.toml" >&2; exit 1
          fi

      - name: Typecheck Edge Functions & _shared modules (deno check)
        run: |
          deno check \
            supabase/functions/_shared/aiIdempotency.ts \
            supabase/functions/_shared/coachContractSchema.ts \
            supabase/functions/_shared/oauthState.ts \
            supabase/functions/_shared/redirectAllowlist.ts \
            supabase/functions/delete-account/index.ts \
            supabase/functions/generate-routine/index.ts \
            supabase/functions/google-auth/index.ts \
            supabase/functions/notion-auth/index.ts \
            supabase/functions/notion-sync/index.ts \
            supabase/functions/spotify-auth/index.ts \
            supabase/functions/subscription-webhook/index.ts

      - name: Run Deno 2 Edge unit tests
        run: deno test supabase/functions/_shared/aiIdempotency_test.ts

  db-migrations-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_ephemeral_pg_password
          POSTGRES_DB: aderyth_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d aderyth_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci_ephemeral_pg_password
      PGDATABASE: aderyth_ci
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Bootstrap local Postgres 17 auth/extensions stubs
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN NOINHERIT;
          CREATE ROLE authenticated NOLOGIN NOINHERIT;
          CREATE ROLE service_role NOLOGIN NOINHERIT BYPASSRLS;
          CREATE ROLE supabase_auth_admin NOLOGIN NOINHERIT;
          GRANT anon, authenticated, service_role, supabase_auth_admin TO postgres;

          CREATE SCHEMA IF NOT EXISTS extensions;
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp" WITH SCHEMA extensions;
          CREATE EXTENSION IF NOT EXISTS "pgcrypto" WITH SCHEMA extensions;
          GRANT USAGE ON SCHEMA extensions TO PUBLIC, anon, authenticated, service_role, supabase_auth_admin;

          CREATE SCHEMA IF NOT EXISTS auth;
          GRANT USAGE ON SCHEMA auth TO PUBLIC, anon, authenticated, service_role, supabase_auth_admin;

          CREATE TABLE IF NOT EXISTS auth.users (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            email text,
            raw_user_meta_data jsonb DEFAULT '{}'::jsonb,
            created_at timestamptz DEFAULT now()
          );
          GRANT SELECT ON TABLE auth.users TO PUBLIC, anon, authenticated, service_role, supabase_auth_admin;

          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid
          LANGUAGE sql STABLE AS $$
            SELECT COALESCE(
              NULLIF(current_setting('request.jwt.claim.sub', true), ''),
              (NULLIF(current_setting('request.jwt.claims', true), '')::jsonb ->> 'sub')
            )::uuid
          $$;

          CREATE OR REPLACE FUNCTION auth.role() RETURNS text
          LANGUAGE sql STABLE AS $$
            SELECT COALESCE(
              NULLIF(current_setting('request.jwt.claim.role', true), ''),
              (NULLIF(current_setting('request.jwt.claims', true), '')::jsonb ->> 'role'),
              current_user::text
            )
          $$;

          CREATE OR REPLACE FUNCTION auth.jwt() RETURNS jsonb
          LANGUAGE sql STABLE AS $$
            SELECT COALESCE(
              NULLIF(current_setting('request.jwt.claims', true), '')::jsonb,
              '{}'::jsonb
            )
          $$;

          GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA auth TO PUBLIC, anon, authenticated, service_role, supabase_auth_admin;
          SQL

      - name: Apply live_schema.sql baseline
        run: psql -v ON_ERROR_STOP=1 -f supabase/live_schema.sql

      # F02, rollback contract (DB1-15, DB2-07). This records the catalog of live_schema.sql alone,
      # before 037 or any 028+ migration touches it. After the forward run, the rollback scripts in
      # supabase/rollbacks/ must bring the catalog back to exactly this file. The files in $RUNNER_TEMP
      # live for this job only; every command here talks to the throwaway Postgres above.
      - name: Fingerprint baseline catalog (live_schema.sql only)
        run: psql -X -At -v ON_ERROR_STOP=1 -f supabase/rollbacks/catalog_fingerprint.sql > "$RUNNER_TEMP/fp_baseline.txt"

      - name: Verify 037_today_bootstrap_rpc.sql works even before 028..036 are applied
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/037_today_bootstrap_rpc.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO auth.users (id, email)
          VALUES
            ('11111111-1111-4111-8111-111111111111', 'u1@aderyth.test'),
            ('22222222-2222-4222-8222-222222222222', 'u2@aderyth.test');

          BEGIN;
          SET LOCAL ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub', '11111111-1111-4111-8111-111111111111', true);
          SELECT set_config('request.jwt.claim.role', 'authenticated', true);
          DO $$
          DECLARE
            v_payload jsonb;
          BEGIN
            v_payload := public.get_today_bootstrap(CURRENT_DATE);
            IF (v_payload ->> 'time_off_available')::boolean IS NOT FALSE THEN
              RAISE EXCEPTION 'Expected time_off_available=false before 028 applies';
            END IF;
            IF (v_payload ->> 'checklist_available')::boolean IS NOT FALSE THEN
              RAISE EXCEPTION 'Expected checklist_available=false before 029 applies';
            END IF;
          END $$;
          COMMIT;
          SQL

      # F03: 038 builds on 036's XP ledger. On a database without 036 (here: live_schema.sql and 037 only)
      # it must stop at its first statement and change nothing.
      - name: 038 refuses to run before 036 (precondition, negative control)
        run: |
          set -euo pipefail
          err="$RUNNER_TEMP/m038_precondition.err"
          psql -X -At -v ON_ERROR_STOP=1 -f supabase/rollbacks/catalog_fingerprint.sql > "$RUNNER_TEMP/fp_before_038_refusal.txt"
          if psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/038_xp_streak_integrity.sql 2>"$err"; then
            echo "038 ran although 036 is not applied" >&2; exit 1
          fi
          grep -q "038 requires 036" "$err"
          psql -X -At -v ON_ERROR_STOP=1 -f supabase/rollbacks/catalog_fingerprint.sql > "$RUNNER_TEMP/fp_after_038_refusal.txt"
          diff -u "$RUNNER_TEMP/fp_before_038_refusal.txt" "$RUNNER_TEMP/fp_after_038_refusal.txt"

      - name: 040 refuses to run before its prerequisites (precondition, negative control)
        run: |
          set -euo pipefail
          err="$RUNNER_TEMP/m040_precondition.err"
          psql -X -At -v ON_ERROR_STOP=1 -f supabase/rollbacks/catalog_fingerprint.sql > "$RUNNER_TEMP/fp_before_040_refusal.txt"
          if psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/040_privilege_hygiene.sql 2>"$err"; then
            echo "040 ran although 036..039 and 028..031 are not applied" >&2; exit 1
          fi
          grep -q "040 requires 036" "$err"
          psql -X -At -v ON_ERROR_STOP=1 -f supabase/rollbacks/catalog_fingerprint.sql > "$RUNNER_TEMP/fp_after_040_refusal.txt"
          diff -u "$RUNNER_TEMP/fp_before_040_refusal.txt" "$RUNNER_TEMP/fp_after_040_refusal.txt"

      - name: Apply forward migrations 028+ and verify RLS-isolated single-RTT bootstrap
        run: |
          for mig in $(ls supabase/migrations/[0-9][0-9][0-9]_*.sql | sort); do
            num="$(basename "$mig" | cut -d'_' -f1)"
            if [ "$((10#$num))" -ge 28 ]; then
              echo "Applying $mig ..."
              psql -v ON_ERROR_STOP=1 -f "$mig"
            fi
          done

          psql -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          SET LOCAL ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub', '11111111-1111-4111-8111-111111111111', true);
          SELECT set_config('request.jwt.claim.role', 'authenticated', true);

          INSERT INTO public.habits (id, user_id, name, tracking_type, status)
          VALUES ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa', '11111111-1111-4111-8111-111111111111', 'Sabah Yürüyüşü', 'boolean', 'active');

          INSERT INTO public.tasks (id, user_id, title, status, priority, list_type)
          VALUES ('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb', '11111111-1111-4111-8111-111111111111', 'Rapor hazırla', 'pending', 'high', 'inbox');

          INSERT INTO public.habit_pauses (user_id, habit_id, kind, start_date, end_date)
          VALUES ('11111111-1111-4111-8111-111111111111', 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa', 'pause', CURRENT_DATE, CURRENT_DATE + 2);

          DO $$
          DECLARE
            v_u1 jsonb;
          BEGIN
            v_u1 := public.get_today_bootstrap(CURRENT_DATE);
            IF jsonb_array_length(v_u1 -> 'habits') <> 1 THEN
              RAISE EXCEPTION 'Expected 1 habit for user 1, got %', jsonb_array_length(v_u1 -> 'habits');
            END IF;
            IF jsonb_array_length(v_u1 -> 'tasks') <> 1 THEN
              RAISE EXCEPTION 'Expected 1 task for user 1, got %', jsonb_array_length(v_u1 -> 'tasks');
            END IF;
            IF (v_u1 ->> 'time_off_available')::boolean IS NOT TRUE THEN
              RAISE EXCEPTION 'Expected time_off_available=true after 028 applies';
            END IF;
            IF jsonb_array_length(v_u1 -> 'pauses') <> 1 THEN
              RAISE EXCEPTION 'Expected 1 pause for user 1, got %', jsonb_array_length(v_u1 -> 'pauses');
            END IF;
          END $$;
          COMMIT;

          -- Tenant isolation check: user 2 must see zero rows from user 1
          BEGIN;
          SET LOCAL ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub', '22222222-2222-4222-8222-222222222222', true);
          SELECT set_config('request.jwt.claim.role', 'authenticated', true);
          DO $$
          DECLARE
            v_u2 jsonb;
          BEGIN
            v_u2 := public.get_today_bootstrap(CURRENT_DATE);
            IF jsonb_array_length(v_u2 -> 'habits') <> 0 OR jsonb_array_length(v_u2 -> 'tasks') <> 0 OR jsonb_array_length(v_u2 -> 'pauses') <> 0 THEN
              RAISE EXCEPTION 'RLS leak detected in get_today_bootstrap: %', v_u2;
            END IF;
          END $$;
          COMMIT;
          SQL

      # Behavioural SQL gate (F01, TST-01 / TST-V01 / TST-07). Runs against the throwaway
      # Postgres above only: run.sh refuses any PGHOST that is not local. It checks the client
      # write bans, SECURITY DEFINER hygiene, xp_drift() = 0 through the real trigger chain,
      # two-user isolation and real concurrency. Known holes are listed in
      # supabase/tests/expected_failures.txt, which is reconciled in both directions.
      - name: Behavioural SQL tests (grants, RLS, SECURITY DEFINER hygiene, xp_drift, concurrency)
        run: bash supabase/tests/run.sh

      # F02, rollback contract (DB1-15, DB2-07): forward state -> every rollback script, newest to
      # oldest -> the catalog must equal the baseline -> forward again, with the same catalog and the
      # same behavioural tests. Nothing below leaves the throwaway Postgres service of this job.
      - name: Fingerprint forward catalog (028..last)
        run: psql -X -At -v ON_ERROR_STOP=1 -f supabase/rollbacks/catalog_fingerprint.sql > "$RUNNER_TEMP/fp_forward_1.txt"

      # A rollback must refuse unless its own number was confirmed in the same session (a neighbour's
      # confirmation must not unlock it), and 036 must refuse while 038, which uses the XP ledger,
      # is still applied. A refusal changes nothing: the catalog is compared with the forward one after.
      - name: Rollback scripts must refuse without their own confirmation (negative controls)
        run: |
          set -euo pipefail
          err="$RUNNER_TEMP/rollback_refusal.err"
          scripts="$(ls supabase/rollbacks/[0-9][0-9][0-9]_*.rollback.sql | sort)"
          nums="$(for rb in $scripts; do basename "$rb" | cut -d'_' -f1; done)"
          for rb in $scripts; do
            num="$(basename "$rb" | cut -d'_' -f1)"
            wrong="$(printf '%s\n' $nums | awk -v n="$num" '$0 > n && !found { print; found = 1 }')"
            if [ -z "$wrong" ]; then wrong="$(printf '%s\n' $nums | awk 'NR == 1')"; fi
            if psql -X -v ON_ERROR_STOP=1 -f "$rb" 2>"$err"; then
              echo "$rb ran without any confirmation" >&2; exit 1
            fi
            grep -q "aderyth.rollback_confirm = '${num}'" "$err"
            if psql -X -v ON_ERROR_STOP=1 -c "SET aderyth.rollback_confirm = '${wrong}'" -f "$rb" 2>"$err"; then
              echo "$rb ran with the confirmation of ${wrong}" >&2; exit 1
            fi
            grep -q "aderyth.rollback_confirm = '${num}'" "$err"
          done
          # 038 is applied in this state (its real fn_habit_log_guard exists), so 036 must refuse to go first
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT to_regprocedure('public.fn_habit_log_guard()') IS NOT NULL")" = "t"
          if psql -X -v ON_ERROR_STOP=1 -c "SET aderyth.rollback_confirm = '036'" \
               -f supabase/rollbacks/036_live_audit_hardening.rollback.sql 2>"$err"; then
            echo "036 rollback ran while 038 (fn_habit_log_guard) is applied" >&2; exit 1
          fi
          grep -q "038 is still applied" "$err"
          # a client that does NOT stop on errors (psql without ON_ERROR_STOP, a script runner) gets no further
          # either: the failed guard leaves the transaction aborted, every later statement is refused and
          # COMMIT rolls back. This is why each guard has to sit inside the transaction.
          for rb in $scripts; do
            psql -X -f "$rb" > /dev/null 2>&1 || true
          done
          psql -X -At -v ON_ERROR_STOP=1 -f supabase/rollbacks/catalog_fingerprint.sql > "$RUNNER_TEMP/fp_after_refusals.txt"
          diff -u "$RUNNER_TEMP/fp_forward_1.txt" "$RUNNER_TEMP/fp_after_refusals.txt"

      - name: Roll back newest to oldest (rollback cycle)
        run: |
          set -euo pipefail
          for rb in $(ls supabase/rollbacks/[0-9][0-9][0-9]_*.rollback.sql | sort -r); do
            num="$(basename "$rb" | cut -d'_' -f1)"
            if [ "$((10#$num))" -ge 28 ]; then
              echo "Rolling back $rb"
              psql -X -v ON_ERROR_STOP=1 -c "SET aderyth.rollback_confirm = '${num}'" -f "$rb"
            fi
          done

      # `set -euo pipefail` and `diff -u`: a difference exits non-zero, so the step is red and the
      # difference is in the log. Nothing here can fail silently.
      - name: Rolled-back catalog must equal the baseline, xp_drift must be empty
        run: |
          set -euo pipefail
          psql -X -At -v ON_ERROR_STOP=1 -f supabase/rollbacks/catalog_fingerprint.sql > "$RUNNER_TEMP/fp_rolled_back.txt"
          diff -u "$RUNNER_TEMP/fp_baseline.txt" "$RUNNER_TEMP/fp_rolled_back.txt"
          drift="$(psql -X -At -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public.xp_drift()')"
          echo "xp_drift rows after rollback: ${drift}"
          test "${drift}" = "0"

      # A second pass: every script converges to the same state, except 036 and 038, which refuse on
      # purpose once they are gone (036's TO PUBLIC grants must never run on a database where 036 is
      # not applied; 038 would give the award trigger a body that writes a ledger 036 no longer has).
      - name: Second rollback pass changes nothing (036 refuses once it is gone)
        run: |
          set -euo pipefail
          err="$RUNNER_TEMP/rollback_second.err"
          for rb in $(ls supabase/rollbacks/[0-9][0-9][0-9]_*.rollback.sql | sort -r); do
            num="$(basename "$rb" | cut -d'_' -f1)"
            if [ "${num}" = "036" ]; then
              if psql -X -v ON_ERROR_STOP=1 -c "SET aderyth.rollback_confirm = '${num}'" -f "$rb" 2>"$err"; then
                echo "036 rollback ran a second time" >&2; exit 1
              fi
              grep -q "036 is not applied" "$err"
            elif [ "${num}" = "038" ]; then
              if psql -X -v ON_ERROR_STOP=1 -c "SET aderyth.rollback_confirm = '${num}'" -f "$rb" 2>"$err"; then
                echo "038 rollback ran a second time" >&2; exit 1
              fi
              grep -q "038 is not applied" "$err"
            elif [ "${num}" = "040" ]; then
              if psql -X -v ON_ERROR_STOP=1 -c "SET aderyth.rollback_confirm = '${num}'" -f "$rb" 2>"$err"; then
                echo "040 rollback ran a second time" >&2; exit 1
              fi
              grep -q "040 is not applied" "$err"
            else
              psql -X -v ON_ERROR_STOP=1 -c "SET aderyth.rollback_confirm = '${num}'" -f "$rb"
            fi
          done
          psql -X -At -v ON_ERROR_STOP=1 -f supabase/rollbacks/catalog_fingerprint.sql > "$RUNNER_TEMP/fp_rolled_back_2.txt"
          diff -u "$RUNNER_TEMP/fp_baseline.txt" "$RUNNER_TEMP/fp_rolled_back_2.txt"

      # The rows the rollback removed (habit_pauses fixture and the like) do not come back; the
      # tables do, empty. The behavioural tests build their own fixtures.
      - name: Re-apply forward migrations (apply, roll back, apply again)
        run: |
          set -euo pipefail
          for mig in $(ls supabase/migrations/[0-9][0-9][0-9]_*.sql | sort); do
            num="$(basename "$mig" | cut -d'_' -f1)"
            if [ "$((10#$num))" -ge 28 ]; then
              echo "Re-applying $mig"
              psql -X -v ON_ERROR_STOP=1 -f "$mig"
            fi
          done
          psql -X -At -v ON_ERROR_STOP=1 -f supabase/rollbacks/catalog_fingerprint.sql > "$RUNNER_TEMP/fp_forward_2.txt"
          diff -u "$RUNNER_TEMP/fp_forward_1.txt" "$RUNNER_TEMP/fp_forward_2.txt"
          bash supabase/tests/run.sh

      # DB2-07 on real rows. The plain cycle above carries no XP, so it cannot tell whether the 036
      # rollback keeps xp_drift() empty. Here a user deletes one done day and rewrites another with a
      # lower award: the ledger keeps each day's highest award, total_xp was raised by it once, habit_logs
      # no longer carries it, and xp_drift() reports the user. The rollback must move that XP into
      # purged_xp, and must refuse (changing nothing) when that would leave a user out of balance.
      # The fixture relies on the trigger chain of 036 alone, so 038 (F03) is rolled back first (the 036
      # script refuses while fn_habit_log_guard exists) and applied again at the end.
      - name: Rollback 036 keeps the XP books straight when the ledger holds more than habit_logs (DB2-07)
        run: |
          set -euo pipefail
          err="$RUNNER_TEMP/rollback_036_drift.err"
          uid='f2000000-0000-4000-8000-000000000001'
          psql -X -v ON_ERROR_STOP=1 -c "SET aderyth.rollback_confirm = '038'" -f supabase/rollbacks/038_xp_streak_integrity.rollback.sql
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT to_regprocedure('public.fn_habit_log_guard()') IS NULL")" = "t"
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO auth.users (id, email) VALUES ('f2000000-0000-4000-8000-000000000001', 'f02@aderyth.test');
          BEGIN;
          -- the dormant pet trigger would trip over the unseeded pet_stages table: only this insert runs without triggers
          SET LOCAL session_replication_role = replica;
          INSERT INTO public.profiles (id, email, username) VALUES ('f2000000-0000-4000-8000-000000000001', 'f02@aderyth.test', 'f02');
          SET LOCAL session_replication_role = origin;
          SET LOCAL ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub', 'f2000000-0000-4000-8000-000000000001', true);
          SELECT set_config('request.jwt.claim.role', 'authenticated', true);
          INSERT INTO public.habits (id, user_id, name, tracking_type, status)
          VALUES ('f2aaaaaa-0000-4000-8000-000000000001', 'f2000000-0000-4000-8000-000000000001', 'DB2-07', 'boolean', 'active');
          INSERT INTO public.habit_logs (habit_id, user_id, completed_at, state, is_completed)
          VALUES ('f2aaaaaa-0000-4000-8000-000000000001', 'f2000000-0000-4000-8000-000000000001', CURRENT_DATE, 'done', true),
                 ('f2aaaaaa-0000-4000-8000-000000000001', 'f2000000-0000-4000-8000-000000000001', CURRENT_DATE - 1, 'done', true);
          -- both days are paid and in the ledger; now one is deleted and the other written again with less
          DELETE FROM public.habit_logs WHERE habit_id = 'f2aaaaaa-0000-4000-8000-000000000001';
          -- value 0 makes the partial award lower than the done award (the default value 1 of a goal-1 habit would pay the same)
          INSERT INTO public.habit_logs (habit_id, user_id, completed_at, state, is_completed, value)
          VALUES ('f2aaaaaa-0000-4000-8000-000000000001', 'f2000000-0000-4000-8000-000000000001', CURRENT_DATE - 1, 'partial', false, 0);
          COMMIT;
          SQL
          # the fixture is not vacuous: the books really are out of balance before the rollback, and the
          # rewritten day is paid LESS than the ledger holds for it (lower, not zero)
          drift="$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT drift FROM public.xp_drift() WHERE user_id = '${uid}'")"
          echo "xp_drift before the rollback: ${drift}"
          test -n "${drift}"
          test "${drift}" -gt 0
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM public.habit_xp_awards a JOIN public.habit_logs l ON l.habit_id = a.habit_id AND l.completed_at = a.day WHERE a.user_id = '${uid}' AND l.xp > 0 AND l.xp < a.xp_awarded")" = "1"
          # (a) the books were already corrected by hand: moving the same XP again would put the user out of balance
          psql -X -v ON_ERROR_STOP=1 -c "UPDATE public.profiles SET purged_xp = purged_xp + ${drift} WHERE id = '${uid}'"
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public.xp_drift()')" = "0"
          if psql -X -v ON_ERROR_STOP=1 -c "SET aderyth.rollback_confirm = '036'" -f supabase/rollbacks/036_live_audit_hardening.rollback.sql 2>"$err"; then
            echo "036 rollback ran although it would have put a user out of balance" >&2; exit 1
          fi
          grep -q "would add xp_drift rows" "$err"
          # ... and the refusal rolled the whole transaction back: ledger kept, grants still closed, no XP moved
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT to_regclass('public.habit_xp_awards') IS NOT NULL AND NOT has_function_privilege('anon', 'public.get_weekly_leaderboard(integer)', 'EXECUTE')")" = "t"
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT purged_xp FROM public.profiles WHERE id = '${uid}'")" = "${drift}"
          # (b) the real case: undo the manual correction, roll back, and the XP moves into purged_xp
          psql -X -v ON_ERROR_STOP=1 -c "UPDATE public.profiles SET purged_xp = purged_xp - ${drift} WHERE id = '${uid}'"
          psql -X -v ON_ERROR_STOP=1 -c "SET aderyth.rollback_confirm = '036'" -f supabase/rollbacks/036_live_audit_hardening.rollback.sql
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public.xp_drift()')" = "0"
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT purged_xp FROM public.profiles WHERE id = '${uid}'")" = "${drift}"
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT to_regclass('public.habit_xp_awards') IS NULL")" = "t"
          # (c) forward again: the ledger is rebuilt from habit_logs and the books stay straight
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/036_live_audit_hardening.sql
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public.xp_drift()')" = "0"
          # ... and 038 on top of it again
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/038_xp_streak_integrity.sql
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public.xp_drift()')" = "0"

      # F03: the same books one migration later. Under 038 a deleted log's xp moves into purged_xp when the
      # log is deleted, so the ledger may hold more than habit_logs while the books already balance (a day
      # deleted for good, a day deleted and written again, a habit recreated under the same name). The 038
      # rollback must cut the ledger down to what the logs carry; otherwise 036's rollback, which moves
      # every such excess into purged_xp, would count it a second time and refuse.
      - name: Rollback 038 then 036 on rows written under 038 keeps the XP books straight (no second transfer)
        run: |
          set -euo pipefail
          uid='f3000000-0000-4000-8000-000000000001'
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO auth.users (id, email) VALUES ('f3000000-0000-4000-8000-000000000001', 'f03@aderyth.test');
          BEGIN;
          -- the dormant pet trigger would trip over the unseeded pet_stages table: only this insert runs without triggers
          SET LOCAL session_replication_role = replica;
          INSERT INTO public.profiles (id, email, username) VALUES ('f3000000-0000-4000-8000-000000000001', 'f03@aderyth.test', 'f03');
          SET LOCAL session_replication_role = origin;
          SET LOCAL ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub', 'f3000000-0000-4000-8000-000000000001', true);
          SELECT set_config('request.jwt.claim.role', 'authenticated', true);
          INSERT INTO public.habits (id, user_id, name, tracking_type, status)
          VALUES ('f3aaaaaa-0000-4000-8000-000000000001', 'f3000000-0000-4000-8000-000000000001', 'F03 kitap', 'boolean', 'active'),
                 ('f3aaaaaa-0000-4000-8000-000000000002', 'f3000000-0000-4000-8000-000000000001', 'F03 yürüyüş', 'boolean', 'active');
          INSERT INTO public.habit_logs (habit_id, user_id, completed_at, state, is_completed)
          VALUES ('f3aaaaaa-0000-4000-8000-000000000001', 'f3000000-0000-4000-8000-000000000001', CURRENT_DATE, 'done', true);
          INSERT INTO public.habit_logs (habit_id, user_id, completed_at, state, is_completed)
          VALUES ('f3aaaaaa-0000-4000-8000-000000000001', 'f3000000-0000-4000-8000-000000000001', CURRENT_DATE - 1, 'done', true);
          INSERT INTO public.habit_logs (habit_id, user_id, completed_at, state, is_completed)
          VALUES ('f3aaaaaa-0000-4000-8000-000000000001', 'f3000000-0000-4000-8000-000000000001', CURRENT_DATE - 2, 'done', true);
          INSERT INTO public.habit_logs (habit_id, user_id, completed_at, state, is_completed)
          VALUES ('f3aaaaaa-0000-4000-8000-000000000002', 'f3000000-0000-4000-8000-000000000001', CURRENT_DATE, 'done', true);
          -- a day deleted for good, a day deleted and written again (the rewrite carries 0: it was paid)
          DELETE FROM public.habit_logs WHERE habit_id = 'f3aaaaaa-0000-4000-8000-000000000001' AND completed_at IN (CURRENT_DATE, CURRENT_DATE - 1);
          INSERT INTO public.habit_logs (habit_id, user_id, completed_at, state, is_completed)
          VALUES ('f3aaaaaa-0000-4000-8000-000000000001', 'f3000000-0000-4000-8000-000000000001', CURRENT_DATE - 1, 'done', true);
          -- a habit deleted and recreated under the same name, its day written again
          DELETE FROM public.habits WHERE id = 'f3aaaaaa-0000-4000-8000-000000000002';
          INSERT INTO public.habits (id, user_id, name, tracking_type, status)
          VALUES ('f3aaaaaa-0000-4000-8000-000000000003', 'f3000000-0000-4000-8000-000000000001', 'F03 Yürüyüş ', 'boolean', 'active');
          INSERT INTO public.habit_logs (habit_id, user_id, completed_at, state, is_completed)
          VALUES ('f3aaaaaa-0000-4000-8000-000000000003', 'f3000000-0000-4000-8000-000000000001', CURRENT_DATE, 'done', true);
          COMMIT;
          SQL
          excess_sql="SELECT coalesce(sum(greatest(a.xp_awarded - coalesce(l.xp, 0), 0)), 0) FROM public.habit_xp_awards a LEFT JOIN public.habit_logs l ON l.habit_id = a.habit_id AND l.completed_at = a.day WHERE a.user_id = '${uid}'"
          # the fixture is not vacuous: the books balance, yet the ledger holds more than the logs, orphans included
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public.xp_drift()')" = "0"
          excess="$(psql -X -At -v ON_ERROR_STOP=1 -c "${excess_sql}")"
          echo "ledger excess under 038: ${excess}"
          test "${excess}" -gt 0
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM public.habit_xp_awards a WHERE a.user_id = '${uid}' AND NOT EXISTS (SELECT 1 FROM public.habits h WHERE h.id = a.habit_id)")" -ge 1
          purged="$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT purged_xp FROM public.profiles WHERE id = '${uid}'")"
          test "${purged}" -gt 0
          # 038 goes: the books are untouched, the ledger holds what the logs carry and no orphan
          psql -X -v ON_ERROR_STOP=1 -c "SET aderyth.rollback_confirm = '038'" -f supabase/rollbacks/038_xp_streak_integrity.rollback.sql
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public.xp_drift()')" = "0"
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c "${excess_sql}")" = "0"
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT purged_xp FROM public.profiles WHERE id = '${uid}'")" = "${purged}"
          # 036 goes: nothing is moved a second time
          psql -X -v ON_ERROR_STOP=1 -c "SET aderyth.rollback_confirm = '036'" -f supabase/rollbacks/036_live_audit_hardening.rollback.sql
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public.xp_drift()')" = "0"
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT purged_xp FROM public.profiles WHERE id = '${uid}'")" = "${purged}"
          # forward again for the steps below
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/036_live_audit_hardening.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/038_xp_streak_integrity.sql
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public.xp_drift()')" = "0"

      # The no-data-loss contract of the coach CHECK rollbacks (032, 034, 035), on a real row. A row of
      # the newest type exists: each rollback must still succeed, keep the row, leave the constraint
      # NOT VALID (it then guards new writes only) and refuse a new write of the removed type.
      - name: Coach CHECK rollbacks keep rows of a newer type (NOT VALID, nothing deleted)
        run: |
          set -euo pipefail
          err="$RUNNER_TEMP/rollback_coach_check.err"
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO auth.users (id, email) VALUES ('f2000000-0000-4000-8000-000000000002', 'f02b@aderyth.test');
          INSERT INTO public.ai_conversations (id, user_id, title)
          VALUES ('f2cccccc-0000-4000-8000-000000000002', 'f2000000-0000-4000-8000-000000000002', 'F02');
          INSERT INTO public.ai_conversation_actions (id, conversation_id, user_id, action_type, payload)
          VALUES ('f2dddddd-0000-4000-8000-000000000002', 'f2cccccc-0000-4000-8000-000000000002', 'f2000000-0000-4000-8000-000000000002', 'lighten_week', '{}'::jsonb);
          SQL
          for num in 035 034 032; do
            rb="$(ls supabase/rollbacks/${num}_*.rollback.sql)"
            psql -X -v ON_ERROR_STOP=1 -c "SET aderyth.rollback_confirm = '${num}'" -f "$rb" 2>"$err"
            grep -q "left NOT VALID" "$err"
          done
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM public.ai_conversation_actions WHERE action_type = 'lighten_week'")" = "1"
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT convalidated FROM pg_constraint WHERE conname = 'ai_actions_type_check'")" = "f"
          if psql -X -v ON_ERROR_STOP=1 -c "INSERT INTO public.ai_conversation_actions (conversation_id, user_id, action_type, payload) VALUES ('f2cccccc-0000-4000-8000-000000000002', 'f2000000-0000-4000-8000-000000000002', 'lighten_week', '{}'::jsonb)" 2>"$err"; then
            echo "a new write of the removed type was accepted" >&2; exit 1
          fi
          grep -q "ai_actions_type_check" "$err"
          psql -X -v ON_ERROR_STOP=1 -c "INSERT INTO public.ai_conversation_actions (conversation_id, user_id, action_type, payload) VALUES ('f2cccccc-0000-4000-8000-000000000002', 'f2000000-0000-4000-8000-000000000002', 'log_habit', '{}'::jsonb)"

      # F07.1: behavioural proof of migration 039's pre-existing data dedupe and unrefunded-failure heal
      # (plan 07 cases 3-5, which cannot use \i inside supabase/tests/07_focus_point_039.sql).
      - name: Migration 039 deduplicates resent user messages and refunds only post-claim failed charges (F07.1)
        run: |
          set -euo pipefail
          uid='f7000000-0000-4000-8000-000000000001'
          cid='f7cccccc-0000-4000-8000-000000000001'
          psql -X -v ON_ERROR_STOP=1 -c "SET aderyth.rollback_confirm = '039'" -f supabase/rollbacks/039_focus_point_hardening.rollback.sql
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO auth.users (id, email) VALUES ('f7000000-0000-4000-8000-000000000001', 'f07@aderyth.test');
          SELECT public.get_or_init_subscription_for('f7000000-0000-4000-8000-000000000001');
          UPDATE public.user_subscriptions SET focus_points = 50 WHERE user_id = 'f7000000-0000-4000-8000-000000000001';
          INSERT INTO public.ai_conversations (id, user_id, title)
          VALUES ('f7cccccc-0000-4000-8000-000000000001', 'f7000000-0000-4000-8000-000000000001', 'F07 dedupe');
          -- Case 3: duplicate user messages before 039's unique index exists (earliest id must survive)
          INSERT INTO public.ai_messages (id, conversation_id, user_id, role, content, request_id, created_at) VALUES
            ('f7aaaaaa-0000-4000-8000-000000000001', 'f7cccccc-0000-4000-8000-000000000001', 'f7000000-0000-4000-8000-000000000001', 'user', 'Ayni soru', 'f07-dup-req', now() - interval '2 minutes'),
            ('f7aaaaaa-0000-4000-8000-000000000002', 'f7cccccc-0000-4000-8000-000000000001', 'f7000000-0000-4000-8000-000000000001', 'user', 'Ayni soru', 'f07-dup-req', now() - interval '1 minute');
          -- Case 4: failed claim whose charge (created_at >= claim.created_at) was never refunded -> 039 must refund +5
          INSERT INTO public.ai_requests (user_id, request_id, mode, input_fingerprint, status, error, created_at)
          VALUES ('f7000000-0000-4000-8000-000000000001', 'f07-heal-req', 'coach', 'fp-heal', 'failed', 'provider timeout', now() - interval '10 minutes');
          UPDATE public.user_subscriptions SET focus_points = 45 WHERE user_id = 'f7000000-0000-4000-8000-000000000001';
          INSERT INTO public.credit_transactions (user_id, delta, reason, balance_after, request_id, created_at)
          VALUES ('f7000000-0000-4000-8000-000000000001', -5, 'ai_coach', 45, 'f07-heal-req', now() - interval '9 minutes');
          -- Case 5: charge OLDER than the claim row (pre-023 key) -> 039 must NOT refund it
          UPDATE public.user_subscriptions SET focus_points = 40 WHERE user_id = 'f7000000-0000-4000-8000-000000000001';
          INSERT INTO public.credit_transactions (user_id, delta, reason, balance_after, request_id, created_at)
          VALUES ('f7000000-0000-4000-8000-000000000001', -5, 'ai_coach', 40, 'f07-preclaim-req', now() - interval '20 minutes');
          INSERT INTO public.ai_requests (user_id, request_id, mode, input_fingerprint, status, error, created_at)
          VALUES ('f7000000-0000-4000-8000-000000000001', 'f07-preclaim-req', 'coach', 'fp-preclaim', 'failed', 'later fail', now() - interval '5 minutes');
          SQL
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/039_focus_point_hardening.sql
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT id FROM public.ai_messages WHERE conversation_id = '${cid}' AND request_id = 'f07-dup-req'")" = "f7aaaaaa-0000-4000-8000-000000000001"
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT focus_points FROM public.user_subscriptions WHERE user_id = '${uid}'")" = "45"
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM public.credit_transactions WHERE user_id = '${uid}' AND request_id = 'f07-heal-req:refund' AND delta = 5")" = "1"
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM public.credit_transactions WHERE user_id = '${uid}' AND request_id = 'f07-preclaim-req:refund'")" = "0"
          # Idempotency: running 039 a second time returns 0 additional FP
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/039_focus_point_hardening.sql
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT focus_points FROM public.user_subscriptions WHERE user_id = '${uid}'")" = "45"
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public.xp_drift()')" = "0"

      # F09: behavioural proof of migration 040's pre-existing username repair + backup table,
      # VALIDATE CONSTRAINT compatibility, idempotent second apply, and lossless rollback restore.
      - name: Migration 040 repairs invalid usernames with backup and restores them on rollback (F09)
        run: |
          set -euo pipefail
          u_short='f9000000-0000-4000-8000-000000000001'
          u_clean='f9000000-0000-4000-8000-000000000002'
          psql -X -v ON_ERROR_STOP=1 -c "SET aderyth.rollback_confirm = '040'" -f supabase/rollbacks/040_privilege_hygiene.rollback.sql
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO auth.users (id, email) VALUES
            ('f9000000-0000-4000-8000-000000000001', 'f09short@aderyth.test'),
            ('f9000000-0000-4000-8000-000000000002', 'f09clean@aderyth.test');
          BEGIN;
          SET LOCAL session_replication_role = replica;
          INSERT INTO public.profiles (id, email, username) VALUES
            ('f9000000-0000-4000-8000-000000000001', 'f09short@aderyth.test', '  <x>  '),
            ('f9000000-0000-4000-8000-000000000002', 'f09clean@aderyth.test', '  <Ayşe_K>  ');
          COMMIT;
          SQL
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/040_privilege_hygiene.sql
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT username IS NULL FROM public.profiles WHERE id = '${u_short}'")" = "t"
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT username FROM public.profiles WHERE id = '${u_clean}'")" = "Ayşe_K"
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM archive_040.profiles_username_backup WHERE id IN ('${u_short}', '${u_clean}')")" = "2"
          psql -X -v ON_ERROR_STOP=1 -c "ALTER TABLE public.profiles VALIDATE CONSTRAINT profiles_username_shape"
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/040_privilege_hygiene.sql
          psql -X -v ON_ERROR_STOP=1 -c "SET aderyth.rollback_confirm = '040'" -f supabase/rollbacks/040_privilege_hygiene.rollback.sql
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT username FROM public.profiles WHERE id = '${u_short}'")" = "  <x>  "
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT username FROM public.profiles WHERE id = '${u_clean}'")" = "  <Ayşe_K>  "
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/040_privilege_hygiene.sql
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public.xp_drift()')" = "0"

      # F10: behavioural proof of migration 041's idempotent second apply, post-condition guard against
      # bare per-row auth.uid()/auth.role() policies, and negative control proving EXPLAIN omits InitPlan
      # on a bare policy (which 09_rls_initplan_041.sql cannot run directly because sqlBehaviorTestsWired
      # forbids ALTER POLICY and \i meta-commands inside supabase/tests/).
      - name: Migration 041 enforces InitPlan post-condition and re-applies idempotently (F10)
        run: |
          set -euo pipefail
          err="$RUNNER_TEMP/m041_bare_policy.err"
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          ALTER POLICY "Users can view own logs" ON public.habit_logs USING (user_id = auth.uid());
          SET LOCAL ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub', '11111111-1111-4111-8111-111111111111', true);
          SELECT set_config('request.jwt.claim.role', 'authenticated', true);
          DO $$
          DECLARE
            v_line text;
            v_plan text := '';
          BEGIN
            FOR v_line IN EXECUTE 'EXPLAIN (COSTS OFF) SELECT * FROM public.habit_logs' LOOP
              v_plan := v_plan || v_line || E'\n';
            END LOOP;
            IF v_plan ~ 'InitPlan' THEN
              RAISE EXCEPTION 'Expected no InitPlan on bare habit_logs policy, got: %', v_plan;
            END IF;
          END $$;
          ROLLBACK;
          SQL
          psql -X -v ON_ERROR_STOP=1 -c 'ALTER POLICY "Users can view own logs" ON public.habit_logs USING (user_id = auth.uid())'
          if psql -X -v ON_ERROR_STOP=1 <<'SQL' 2>"$err"; then
          DO $$
          DECLARE v_bad text;
          BEGIN
            SELECT string_agg(p.schemaname || '.' || p.tablename || ' / ' || p.policyname, '; ')
              INTO v_bad
              FROM pg_policies p
             WHERE p.schemaname IN ('public', 'archive_f13')
               AND regexp_replace(coalesce(p.qual, '') || ' ' || coalesce(p.with_check, ''),
                                  '\(\s*SELECT\s+auth\.(uid|role)\(\)\s+AS\s+(uid|role)\s*\)', '', 'gi')
                   ~* 'auth\.(uid|role)\(\)';
            IF v_bad IS NOT NULL THEN
              RAISE EXCEPTION '041: policies still call auth.uid()/auth.role() per row: %', v_bad;
            END IF;
          END $$;
          SQL
            echo "041 post-condition accepted a bare policy" >&2; exit 1
          fi
          grep -q "public.habit_logs / Users can view own logs" "$err"
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/041_rls_initplan_and_indexes.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/041_rls_initplan_and_indexes.sql
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_policies WHERE schemaname = 'public' AND tablename = 'tasks'")" = "1"
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT confdeltype FROM pg_constraint WHERE conname = 'tasks_parent_task_id_fkey'")" = "c"
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public.xp_drift()')" = "0"

      # The fingerprint must not tell "never touched" (a NULL ACL) from "revoked and granted back" (the
      # explicit default ACL): a rollback that REVOKEs and GRANTs an object back would otherwise show a
      # difference that is not one. The cycle above cannot show this property: every object of
      # live_schema.sql is owned by postgres, and ALTER DEFAULT PRIVILEGES gives all of them an explicit
      # ACL, so none has a NULL one. Objects of a role without default privileges do; a scratch role owns a
      # table and a function here, and everything is dropped again. This is the last step, so no
      # comparison above can see the scratch objects.
      - name: Fingerprint prints a NULL ACL and the explicit default ACL alike (self-test)
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE zz_fp_probe_owner NOLOGIN" \
            -c "GRANT USAGE, CREATE ON SCHEMA public TO zz_fp_probe_owner" \
            -c "SET ROLE zz_fp_probe_owner" \
            -c "CREATE TABLE public.zz_fingerprint_probe (id integer)" \
            -c "CREATE FUNCTION public.zz_fingerprint_probe() RETURNS integer LANGUAGE sql AS 'SELECT 1'"
          # the probe is not vacuous: both objects really carry a NULL ACL now
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT (SELECT relacl IS NULL FROM pg_class WHERE oid = 'public.zz_fingerprint_probe'::regclass) AND (SELECT proacl IS NULL FROM pg_proc WHERE oid = 'public.zz_fingerprint_probe()'::regprocedure)")" = "t"
          psql -X -At -v ON_ERROR_STOP=1 -f supabase/rollbacks/catalog_fingerprint.sql | grep 'zz_fingerprint_probe' > "$RUNNER_TEMP/fp_probe_before.txt"
          psql -X -v ON_ERROR_STOP=1 \
            -c "REVOKE ALL ON FUNCTION public.zz_fingerprint_probe() FROM PUBLIC" \
            -c "GRANT EXECUTE ON FUNCTION public.zz_fingerprint_probe() TO PUBLIC" \
            -c "REVOKE INSERT ON public.zz_fingerprint_probe FROM zz_fp_probe_owner" \
            -c "GRANT INSERT ON public.zz_fingerprint_probe TO zz_fp_probe_owner"
          # ... and the round trip stored the default ACL explicitly, which is the difference the fingerprint must not show
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT (SELECT relacl IS NOT NULL FROM pg_class WHERE oid = 'public.zz_fingerprint_probe'::regclass) AND (SELECT proacl IS NOT NULL FROM pg_proc WHERE oid = 'public.zz_fingerprint_probe()'::regprocedure)")" = "t"
          psql -X -At -v ON_ERROR_STOP=1 -f supabase/rollbacks/catalog_fingerprint.sql | grep 'zz_fingerprint_probe' > "$RUNNER_TEMP/fp_probe_after.txt"
          test "$(wc -l < "$RUNNER_TEMP/fp_probe_before.txt")" -ge 3
          diff -u "$RUNNER_TEMP/fp_probe_before.txt" "$RUNNER_TEMP/fp_probe_after.txt"
          psql -X -v ON_ERROR_STOP=1 \
            -c "DROP FUNCTION public.zz_fingerprint_probe()" \
            -c "DROP TABLE public.zz_fingerprint_probe" \
            -c "REVOKE USAGE, CREATE ON SCHEMA public FROM zz_fp_probe_owner" \
            -c "DROP ROLE zz_fp_probe_owner"
