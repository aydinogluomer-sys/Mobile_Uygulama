name: CI

# Atlas Phase 0 CI gate (plan §23 / §24 / §32 "CI ekle").
#
# NOTE on package manager: IMPLEMENTATION_V2.md §0.A specifies `yarn install
# --frozen-lockfile`. Per plan Rule 7 ("where the plan and the real repository
# disagree, the real production code is correct"), the repository actually
# ships `frontend/package-lock.json` and no `yarn.lock` — so this workflow
# uses `npm ci`, not yarn. `frontend/package.json` also still declares
# `"packageManager": "yarn@1.22.22"`, which is itself stale (tracked as a P2
# finding in docs/audit/01_REPOSITORY_HYGIENE_AND_SECURITY.md §8); npm is the
# tool that actually matches the committed lockfile.
#
# Scope: build/verify only. No secrets, no Supabase step, no deploy/publish
# step is defined here — this gate proves the app compiles, lints, tests and
# exports; it does not touch any live environment.

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` runs the `postinstall` script (node ./scripts/fix-expo-tsconfig.js)
      # by default — do not add --ignore-scripts here, Gate A depends on it running.
      - name: Install dependencies (npm ci)
        run: npm ci

      # Uses tsconfig.ci.json, NOT the default tsconfig.json. See that file's
      # header for the full reasoning; the short version is that
      # `tsconfig.json` includes `.expo/types/**/*.ts`, which holds
      # expo-router's generated typed-routes declaration. That directory is
      # gitignored and is only ever produced by the Expo dev server, so it is
      # absent here and present on every developer machine — meaning plain
      # `npx tsc --noEmit` checked a different program in the two places. This
      # step used to be exactly that command, and it failed on every push of an
      # entire phase while local runs reported 0 errors.
      #
      # `npm run typecheck:ci` is runnable locally and reproduces this step
      # byte for byte, so the divergence cannot come back invisibly.
      - name: Typecheck (CI parity — see tsconfig.ci.json)
        run: npm run typecheck:ci

      - name: Lint (expo lint)
        run: npx expo lint

      - name: Unit tests (jest --ci)
        run: npx jest --ci

      - name: Structural gate (run-tests.js)
        run: node run-tests.js

      - name: Export — Android
        run: npx expo export --platform android

      - name: Export — iOS
        run: npx expo export --platform ios
