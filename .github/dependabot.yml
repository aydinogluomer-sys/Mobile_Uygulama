# F08 (BLD-03): opens pull requests only; nothing is merged automatically.
# The Expo SDK 57 line is the ceiling: majors of expo, jest, eslint and typescript
# and minors of react-native are SDK migrations, not dependency bumps.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      expo-sdk:
        patterns: ['expo*', '@expo/*', 'react-native*', 'jest-expo']
        update-types: ['patch']
    ignore:
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'expo-*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@expo/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'jest-expo'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'eslint-config-expo'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # Exact-pinned by Expo SDK 57 bundledNativeModules.json (`npx expo install --check`):
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-test-renderer'
      - dependency-name: '@types/react-test-renderer'
      - dependency-name: 'react-native'
      - dependency-name: '@react-native/jest-preset'
      - dependency-name: 'react-native-svg'
      - dependency-name: 'react-native-webview'
      - dependency-name: '@types/react*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react-native-*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@react-native/*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@react-native-async-storage/*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@sentry/react-native'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # Tooling & runtime ceilings (.nvmrc = 22.13.0, Jest 29, Babel 7, Playwright 1.65):
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/jest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@babel/core'
        update-types: ['version-update:semver-major']
      - dependency-name: '@playwright/test'
      - dependency-name: '@testing-library/react-native'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'jest'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
  # Keeps the 40-hex `uses:` pins in .github/workflows current together with their `# vN` comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
